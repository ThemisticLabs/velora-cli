<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>velora · Menubar draft</title><style>
:root{color-scheme:dark;--bg:#171719;--surface:#282829;--ink:#f4f4f4;--muted:#99999c;--line:#444446;--accent:#686be7;--button:#eeeef0;--button-ink:#202021;--hover:#ffffff09}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}main{max-width:860px;margin:auto;padding:46px 24px}.intro{display:flex;align-items:start;justify-content:space-between;gap:24px}.eyebrow{color:var(--muted);font-size:11px;letter-spacing:.09em;text-transform:uppercase}h1{font-size:28px;font-weight:500;letter-spacing:-.025em;margin:10px 0}p{color:var(--muted);margin:0;font-size:13px}.preview{display:flex;justify-content:center;padding:54px 0 32px}.popover{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;width:332px;height:338px;box-shadow:0 12px 40px #0005, inset 0 1px 0 #ffffff0a}.popover:before{content:"";position:absolute;top:-7px;left:calc(50% - 7px);width:13px;height:13px;background:var(--surface);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;letter-spacing:-.02em}.brand a{display:flex;border-radius:4px}.brand img{width:23px;height:19px;object-fit:contain}.status{margin-top:27px;margin-bottom:24px}.state{font-size:15px;font-weight:500}.status p{font-size:12px;margin-top:5px;min-height:17px}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}.primary{width:100%;height:43px;background:var(--button);color:var(--button-ink);border:0;border-radius:8px;font-weight:500}.primary:hover{opacity:.9}.primary:disabled{opacity:.5;cursor:default}.divider{height:1px;background:var(--line);margin:21px 0 8px}.actions{display:grid;gap:1px}.action{display:flex;align-items:center;justify-content:space-between;width:100%;height:35px;border:0;background:transparent;color:var(--ink);padding:0 2px;text-align:left;border-radius:5px}.action:hover{background:var(--hover)}.action img{width:17px;height:17px;filter:invert(1);opacity:.65}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.controls button,.theme{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:6px 10px;font-size:12px}.controls button[aria-pressed="true"]{color:var(--ink);border-color:var(--muted)}.feedback{margin-top:24px;text-align:center;min-height:36px;font-size:12px}body.light{color-scheme:light;--bg:#efeff0;--surface:#f8f8f9;--ink:#222223;--muted:#757578;--line:#d5d5d8;--button:#2525cc;--button-ink:white;--hover:#00000005}body.light .brand img{filter:invert(1)}body.light .action img{filter:none}@media(max-width:400px){main{padding:30px 16px}.popover{width:100%;max-width:332px}.intro{gap:10px}h1{font-size:24px}}
</style></head><body><main><div class="intro"><div><span class="eyebrow">Design draft · simulated menubar</span><h1>Just the controls.</h1><p>Status, Start/Stop, Open velora and Settings.</p></div><button class="theme" id="theme">Light</button></div><div class="preview"><section class="popover" aria-label="velora menubar preview"><div class="brand"><a href="https://themistic.com" target="_blank" rel="noopener noreferrer" aria-label="Open Themistic website"><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjQwIDQwIDQ0MCAzMjAiIGZpbGw9IiNmZmZmZmYiIGFyaWEtaGlkZGVuPSJ0cnVlIj48cGF0aCBkPSJNNDAgNDBIMzMwTDI2MCAxMTBIMTkwVjI3MEwxMjAgMzQwVjExMEg0MFoiLz48cGF0aCBkPSJNMzEwIDkwSDQ4MFYxNjBIMzAwVjI5MEg0ODBWMzYwSDIzMFYxNzBaIi8+PC9zdmc+Cg==" alt="Themistic"></a><span>velora</span></div><div class="status"><div class="state"><span id="state-label">Running</span></div><p id="detail">Local API ready.</p></div><button class="primary" id="service">Stop service</button><div class="divider"></div><div class="actions"><button class="action" id="open"><span>Open velora</span><img src="data:image/svg+xml;base64,PHN2ZwogIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyIKICB3aWR0aD0iMjQiCiAgaGVpZ2h0PSIyNCIKICB2aWV3Qm94PSIwIDAgMjQgMjQiCiAgZmlsbD0ibm9uZSIKICBzdHJva2U9ImN1cnJlbnRDb2xvciIKICBzdHJva2Utd2lkdGg9IjIiCiAgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIgogIHN0cm9rZS1saW5lam9pbj0icm91bmQiCj4KICA8cGF0aCBkPSJNNSAxMmgxNCIgLz4KICA8cGF0aCBkPSJtMTIgNSA3IDctNyA3IiAvPgo8L3N2Zz4K" alt=""></button><button class="action" id="settings"><span>Settings</span><img src="data:image/svg+xml;base64,PHN2ZwogIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyIKICB3aWR0aD0iMjQiCiAgaGVpZ2h0PSIyNCIKICB2aWV3Qm94PSIwIDAgMjQgMjQiCiAgZmlsbD0ibm9uZSIKICBzdHJva2U9ImN1cnJlbnRDb2xvciIKICBzdHJva2Utd2lkdGg9IjIiCiAgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIgogIHN0cm9rZS1saW5lam9pbj0icm91bmQiCj4KICA8cGF0aCBkPSJNMTIuMjIgMmgtLjQ0YTIgMiAwIDAgMC0yIDJ2LjE4YTIgMiAwIDAgMS0xIDEuNzNsLS40My4yNWEyIDIgMCAwIDEtMiAwbC0uMTUtLjA4YT var state = 'running';
for (var button of document.querySelectorAll('[data-state]')) {
    button.addEventListener('click', function () { setState(this.dataset.state); });
}
document.getElementById('service').addEventListener('click', function () {
    if (state === 'running' || state === 'starting') { setState('stopped'); return; }
    setState('running');
});
document.getElementById('open').addEventListener('click', function () { document.getElementById('feedback').textContent = 'Preview: bring the existing velora terminal tab forward, or open velora in the configured terminal.'; });
document.getElementById('settings').addEventListener('click', function () { document.getElementById('feedback').textContent = 'Preview: open the interactive CLI directly in Settings.'; });
document.getElementById('theme').addEventListener('click', function () { document.body.classList.toggle('light'); this.textContent='Light'; if(document.body.classList.contains('light')){this.textContent='Dark';} });
function setState(nextState) {
    state = nextState;
    var label = 'Running';
    var detail = 'Local API ready.';
    var action = 'Stop service';
    if (state === 'stopped') { label='Stopped'; detail='The local API is not running.'; action='Start service'; }
    if (state === 'starting') { label='Starting'; detail='Loading the selected model…'; }
    if (state === 'stopping') { label='Stopping'; detail='Finishing the active request…'; action='Stopping…'; }
    if (state === 'failed') { label='Service failed'; detail='Open velora to check and restart.'; action='Restart service'; }
    document.getElementById('state-label').textContent=label;
    document.getElementById('detail').textContent=detail;
    document.getElementById('service').textContent=action;
    document.getElementById('service').disabled=state==='stopping';
    for(var button of document.querySelectorAll('[data-state]')) { button.setAttribute('aria-pressed',String(button.dataset.state===state)); }
    document.getElementById('feedback').textContent='Simulated state: '+label+'. The real menubar is not changed.';
}
